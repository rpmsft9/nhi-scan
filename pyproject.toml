[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhi-scan"
version = "0.2.0"
description = "Inventory and risk-tier non-human & agent identities against the OWASP NHI Top 10."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raj Penchala" }]
keywords = ["non-human-identity", "nhi", "agentic-identity", "ai-agents", "iam", "owasp", "security"]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
nhi-scan = "nhiscan.cli:main"

[project.urls]
Homepage = "https://github.com/rpmsft9/nhi-scan"

[tool.setuptools]
packages = ["nhiscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
